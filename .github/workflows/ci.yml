# CI: full-coverage verification matrix.
#
# The offline suite runs on every supported CPython (the 3.9 floor through
# 3.13) on every runner platform (Linux, macOS, Windows) — coverage is the
# matrix, not a sample. The lint gate pins the ruff version so a ruff
# release cannot change the gate. The network suite is an explicit opt-in
# job: upstream availability flakes must never gate merges, so it reports
# but cannot fail. The lint gate is strict: the codebase holds zero open
# ruff findings (the former parameter-list waivers became BoszComposition
# and ManifestHeader).

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned ruff
        run: python -m pip install ruff==0.17.4
      - name: Lint
        run: ruff check .

  test:
    name: offline suite (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        exclude:
          # setup-python ships no 3.9 for ubuntu-latest (26.04); the 3.9
          # floor runs on the 24.04 image, where the interpreter exists
          - os: ubuntu-latest
            python-version: "3.9"
        include:
          - os: ubuntu-24.04
            python-version: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with test extras
        run: python -m pip install -e .[test]
      - name: Offline test suite
        shell: bash
        env:
          PYTHONFAULTHANDLER: "1"
        run: |
          set -o pipefail
          python -m pytest 2>&1 | tee pytest_out.log; code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # surface the crash site and each failed test as job annotations
            # — the debugging surface readable through the API without
            # log-download rights
            tail -n 15 pytest_out.log | while IFS= read -r line; do
              echo "##[error]tail| $line"
            done
            grep "^FAILED\|^ERROR" pytest_out.log | while IFS= read -r line; do
              echo "##[error]$line"
            done
          fi
          exit "$code"

  network:
    name: network suite (never gates)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with test extras
        run: python -m pip install -e .[test]
      - name: Catalog URL liveness (explicit opt-in)
        run: python -m pytest -m network -o addopts=""
